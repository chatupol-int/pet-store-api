name: Build
on:
  push:
    branches: [ main, dev ]

jobs:
  test-on-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello from Gitea Actions!"

  scan:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Sonar version
        run: sonar-scanner --version
            - name: Run SonarQube Scanner

      - name: Run SonarQube Scanner 
        run: |
          sonar-scanner \
            -Dsonar.projectKey=pet-store \
            -Dsonar.projectName="pet-store" \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://localhost:9099 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  build-and-push-image:
    runs-on: self-hosted
    steps:
      - run: echo "on tiger hosted"

      - name: Checkout code
        uses: actions/checkout@v3

      - run: pwd
      - run: ls -la
      - run: echo "${{ secrets.DOCKER_PASSWORD }}"  | docker login 192.168.49.2:31269 -u "${{ secrets.DOCKER_USER }}" --password-stdin
      - name: Generate version tag
        run: echo "VERSION=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - run: docker build -t 192.168.49.2:31269/pet-store:${{ env.VERSION }} .
      - run: docker push 192.168.49.2:31269/pet-store:${{ env.VERSION }}
    env:
      VERSION: ${{ env.VERSION }}