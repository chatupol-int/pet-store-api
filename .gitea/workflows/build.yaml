name: Build
on:
  push:
    branches: [ main, dev ]

jobs:
  test-on-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello from Gitea Actions!"

  scan:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:latest  # Run SonarQube in a Docker container
        ports:
          - 9000:9000  # Expose port 9000 for SonarQube
        options: >-
          --health-cmd="curl -f http://localhost:9000/health"
          --health-timeout=30s
          --health-retries=3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run SonarScanner (Docker)
        run: |
          docker run --rm -v $(pwd):/usr/src --network=host sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=my_project_key \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}    

  build-and-push-image:
    runs-on: self-hosted
    steps:
      - run: echo "on tiger hosted"

      - name: Checkout code
        uses: actions/checkout@v3

      - run: pwd
      - run: ls -la
      - run: echo "${{ secrets.DOCKER_PASSWORD }}"  | docker login 192.168.49.2:31269 -u "${{ secrets.DOCKER_USER }}" --password-stdin
      - name: Generate version tag
        run: echo "VERSION=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - run: docker build -t 192.168.49.2:31269/pet-store:${{ env.VERSION }} .
      - run: docker push 192.168.49.2:31269/pet-store:${{ env.VERSION }}
    env:
      VERSION: ${{ env.VERSION }}